version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # Runtime dependencies are pinned exact and allowlisted (scripts/check-deps.mjs),
  # so each bump gets its own PR and a full CI run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      dev:
        dependency-type: development
    cooldown:
      default-days: 14
