version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # Runtime dependencies are pinned exact and allowlisted (scripts/check-deps.mjs),
  # so each bump gets its own PR and a full CI run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      dev:
        dependency-type: development
    ignore:
      # typedoc pins its TypeScript peer range; move when typedoc supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node lines we support (engines, .nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 14
