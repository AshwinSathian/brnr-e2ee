name: Release

# Runs when the maintainer pushes a vX.Y.Z tag. Publishing uses npm trusted
# publishing (OIDC), so there is no npm token anywhere, and npm attaches a
# provenance attestation that links the tarball to this run.
#
# Jobs that hold publishing permissions never install or run dependencies:
# `build` makes the tarball and the docs with read-only permissions, and the
# privileged jobs only verify and ship what it produced.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      node: ${{ steps.pack.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$TAG" || { echo "::error::tag $TAG but package.json says $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          mkdir -p out
          node scripts/release-notes.mjs "$version" > out/notes.md

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build and pack
        id: pack
        run: |
          npm run build
          file="$(npm pack --json --ignore-scripts --pack-destination out | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0))[0].filename)')"
          sha="$(cd out && shasum -a 256 "$file" | cut -d' ' -f1)"
          echo "$sha  $file" > "out/$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          if-no-files-found: error

      - name: Build the API docs
        run: npm run docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/brnr-e2ee
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      # No checkout here, so .nvmrc isn't on disk: build passes its version on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the tarball is the one build produced
        working-directory: out
        env:
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $FILE" | shasum -a 256 -c -

      - name: Publish to npm with provenance
        working-directory: out
        env:
          FILE: ${{ needs.build.outputs.file }}
        run: npm publish "./$FILE" --access public --provenance --ignore-scripts

      - name: Create the GitHub release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ needs.build.outputs.file }}
        run: gh release create "$TAG" "$FILE" "$FILE.sha256" --verify-tag --title "$TAG" --notes-file notes.md

  docs:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
